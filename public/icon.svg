<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021a11" />
      <stop offset="50%" stop-color="#052c1e" />
      <stop offset="100%" stop-color="#01130c" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />

  <!-- Outer Imperial Gold Filigree Ring -->
  <circle cx="256" cy="256" r="215" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-dasharray="16 8" opacity="0.85" />
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.9" />
  <circle cx="256" cy="256" r="185" fill="#031f15" stroke="url(#emeraldGrad)" stroke-width="2" />

  <!-- Crown for Sir Chif3n (Demigod) -->
  <path d="M180 200 L210 240 L256 175 L302 240 L332 200 L325 255 L187 255 Z" fill="url(#goldGrad)" filter="url(#glow)" />
  <circle cx="180" cy="195" r="7" fill="#fde047" />
  <circle cx="256" cy="170" r="9" fill="#fde047" />
  <circle cx="332" cy="195" r="7" fill="#fde047" />

  <!-- Apothecary Herb Leaves for Lady Leslye (Maomao) -->
  <path d="M256 385 C230 330 200 300 256 250 C312 300 282 330 256 385 Z" fill="url(#emeraldGrad)" />
  <path d="M256 255 C220 285 220 330 256 360" fill="none" stroke="#a7f3d0" stroke-width="3" stroke-linecap="round" />
  
  <!-- Left Side Herb Leaf -->
  <path d="M245 315 C205 315 185 285 210 260 C235 285 240 305 245 315 Z" fill="#34d399" opacity="0.9" />
  <!-- Right Side Herb Leaf -->
  <path d="M267 315 C307 315 327 285 302 260 C277 285 272 305 267 315 Z" fill="#34d399" opacity="0.9" />

  <!-- Heart Emblem -->
  <path d="M256 280 C256 280 246 268 238 268 C228 268 222 276 222 284 C222 296 238 308 256 318 C274 308 290 296 290 284 C290 276 284 268 274 268 C266 268 256 280 256 280 Z" fill="#f43f5e" opacity="0.95" />

  <!-- Sparkling Stars -->
  <polygon points="256,120 260,132 272,136 260,140 256,152 252,140 240,136 252,132" fill="#fef08a" />
  <polygon points="140,240 143,248 151,251 143,254 140,262 137,254 129,251 137,248" fill="#fef08a" opacity="0.7" />
  <polygon points="372,240 375,248 383,251 375,254 372,262 369,254 361,251 369,248" fill="#fef08a" opacity="0.7" />
</svg>
